[project]
name = "quadbook"
version = "0.1.0"
description = "Lab code for Bio-Inspired Robotics with MuJoCo: Quadruped Locomotion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco==3.12.0",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "gymnasium>=1.3",
]

[project.optional-dependencies]
# Part 4 (Chapters 10~12): reinforcement learning
rl = [
    "stable-baselines3>=2.9",
    "torch>=2.8",
    "tensorboard>=2.17",
]
# Chapter 13: large-scale parallelization with MJX
mjx = [
    "mujoco-mjx==3.12.0",
    "jax>=0.11",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quadbook"]

[tool.ruff]
line-length = 100
target-version = "py312"
